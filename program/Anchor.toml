[toolchain]
anchor_version = "0.30.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
cookie_bounties = "5Pb9fVyi7t9b5wxDb6tJSNyZUbcuw1uqqacnCYUGq97j"

[programs.devnet]
cookie_bounties = "Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS"

[registry]
url = "https://api.apr.dev"

# Cookie Chain is an SVM / Solana-compatible network. Point `provider.cluster` at the official
# Cookie Chain RPC URL when deploying there (not Solana mainnet). Localnet is used for tests.
[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
